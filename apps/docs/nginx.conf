user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type text/plain;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css image/svg+xml application/json;

    # In the official image this file is a link to the container output.
    access_log /var/log/nginx/access.log;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Redirects from /section/page to /section/page/ stay relative, so they
        # work behind any reverse proxy and host name.
        absolute_redirect off;

        error_page 404 /404.html;

        location = /health {
            access_log off;
        }

        # Astro file names carry a content hash.
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /images/ {
            expires 7d;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
