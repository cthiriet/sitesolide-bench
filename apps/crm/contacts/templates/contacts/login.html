{% extends "contacts/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="card">
  {% csrf_token %}
  {% if form.errors %}<p class="errorlist">Wrong username or password.</p>{% endif %}
  <div class="form-row">
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus required autocomplete="username">
  </div>
  <div class="form-row">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required autocomplete="current-password">
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
{% endblock %}
